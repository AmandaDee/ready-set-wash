[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ready-set-wash"
version = "1.0.0"
description = "Find the cheapest window for your next wash"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "strawberry-graphql[fastapi]>=0.280,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "tzdata>=2025.2,<2027"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ready_set_wash = ["static/*"]
[tool.pytest.ini_options]
addopts = "--cov=ready_set_wash --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=90"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
